apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinema-tickets-app
  namespace: cinema-tickets
  labels:
    app.kubernetes.io/name: cinema-tickets
    app.kubernetes.io/component: backend
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: cinema-tickets
      app.kubernetes.io/component: backend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: cinema-tickets
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          envFrom:
            - configMapRef:
                name: cinema-tickets-config
          command:
            - sh
            - -c
            - until pg_isready -h "$DB_HOST" -p "$DB_PORT"; do echo "waiting for db..."; sleep 2; done

      containers:
        - name: app
          image: isaevskaevica/cinema-tickets:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              name: http

          envFrom:
            - configMapRef:
                name: cinema-tickets-config
            - secretRef:
                name: cinema-tickets-secret

          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10

          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 1Gi